name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source prices and asset paths
        run: npm test
      - name: Build for this repository
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%/*}"
          if [[ "${repository_name,,}" == "${owner_name,,}.github.io" ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${repository_name}/"
          fi
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
